<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Statements</h1>

<p>chose the opreation that you want to do it and enter the numbers</p>

<button type="button" onclick="myFunctionAdd()">add</button>
<button type="button" onclick="myFunctionSubtract()">Subtract</button>
<button type="button" onclick="myFunctionMultiply()">Multiply</button>
<button type="button" onclick="myFunctionDivide()">Divide</button>

 
<br><br>

<input id="num1" type="number">
<input id="num2" type="number">

<p id="demo1"></p> 


<script>
function myFunctionAdd() {
    let x = Number(document.getElementById("num1").value);
    let y = Number(document.getElementById("num2").value);

    let z = x + y;
  document.getElementById("demo1").innerHTML = "The addition of your inpust is: " + z;
}
function myFunctionSubtract() {
    let x = Number(document.getElementById("num1").value);
    let y = Number(document.getElementById("num2").value);

    let z = x - y;
  document.getElementById("demo1").innerHTML = "The Subtract of your inputs is: " + z;
}
function myFunctionMultiply() {
    let x = Number(document.getElementById("num1").value);
    let y = Number(document.getElementById("num2").value);

    let z = x * y;
  document.getElementById("demo1").innerHTML = "The Multiply of yours inputs is: " + z;
}

function myFunctionDivide() {
    let x = Number(document.getElementById("num1").value);
    let y = Number(document.getElementById("num2").value);

    let z = x / y;
    if( y==0){
        document.getElementById("demo1").innerHTML = "Cannot divide by 0";
    }
    else{
        document.getElementById("demo1").innerHTML = "The Divide of yours inputs is: " + z;

    }
  
}
</script>

</body>
</html>
